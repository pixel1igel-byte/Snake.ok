name: Build Snake Online APK

on:
  # Build APK whenever game, Android, server, or workflow files change.
  workflow_dispatch:
  push:
    paths:
      - 'SnakeAndroid/**'
      - 'snake.html'
      - 'render.yaml'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SnakeAndroid
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - name: Prepare game asset
        run: |
          python3 - <<'PY'
          import base64, gzip
          from pathlib import Path
          src = Path("../snake.html").read_bytes()
          dst = Path("app/src/main/assets/game.html.gz.b64")
          dst.parent.mkdir(parents=True, exist_ok=True)
          dst.write_text(base64.b64encode(gzip.compress(src, mtime=0)).decode("ascii"), encoding="ascii")
          print(f"Prepared game asset: {len(src)} bytes HTML")
          PY
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SnakeOnline-debug-apk
          path: SnakeAndroid/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK into repository
        working-directory: .
        run: |
          cp SnakeAndroid/app/build/outputs/apk/debug/app-debug.apk SnakeOnline.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SnakeOnline.apk
          git diff --cached --quiet && exit 0
          git commit -m "Publish latest SnakeOnline APK"
          git push origin HEAD:main
